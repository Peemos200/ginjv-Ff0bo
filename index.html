        body { margin: 0; font-family: 'Prompt', sans-serif; background-color: #0a0a0a; color: #ffffff; }

        .ad-track { display: flex; width: 500%; animation: slideShow 20s infinite; }
        .ad-item { width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; }
        
        @keyframes slideShow { 
            0%, 15% { transform: translateX(0); } 
            20%, 35% { transform: translateX(-20%); } 
            40%, 55% { transform: translateX(-40%); } 
            60%, 75% { transform: translateX(-60%); } 
            80%, 95% { transform: translateX(-80%); } 
            100% { transform: translateX(0); }

        .search-container { display: flex; justify-content: center; margin: 10px 20px 0 20px; }

        /* แถบปุ่มเลือกหมวดหมู่ ปรับให้ดูเป็นปุ่มกดมากขึ้น */
        .category-bar { display: flex; justify-content: center; gap: 15px; margin: 30px 0 10px 0; padding: 0 20px; flex-wrap: wrap; }
        .cat-btn { background-color: #1a1a1a; color: #aaa; border: 1px solid #333; padding: 10px 25px; border-radius: 30px; cursor: pointer; font-size: 15px; font-family: 'Prompt', sans-serif; transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        /* พื้นที่แสดงคลิป */
        .content-area { padding: 20px 40px 10px 40px; max-width: 1200px; margin: 0 auto; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        
        /* การ์ดวิดีโอ (อัปเกรดความสวยงาม) */
        .video-card { background: #151515; border-radius: 12px; overflow: hidden; transition: all 0.3s ease; border: 1px solid #222; box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: relative; }
        .video-card:hover { transform: translateY(-8px); box-shadow: 0 10px 25px rgba(0,0,0,0.7); border-color: #444; }
        
        .thumbnail-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
        .thumbnail { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .video-card:hover .thumbnail { opacity: 0.7; }
        
        /* ปุ่ม Play ลอยขึ้นมาตอนเอาเมาส์ชี้ */
        .play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; }
        .video-card:hover .play-overlay { opacity: 1; }
        .play-icon { width: 50px; height: 50px; background: rgba(229, 9, 20, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        let displayCount = 12; // จำนวนเริ่มต้นที่แสดง 12 คลิป
        const itemsPerClick = 12; // กด Load More 1 ครั้ง จะเพิ่ม 12 คลิป

        function renderVideos() {
            const grid = document.getElementById('video-grid');
            const loadMoreBox = document.getElementById('load-more-box');
            grid.innerHTML = "";

            // กรองหมวดหมู่
            let filteredList = videoList;
            if (currentCategory !== 'all') {
                filteredList = filteredList.filter(video => video.category === currentCategory);
            }

            // กรองคำค้นหา (ถ้ามีการพิมพ์)
            if (searchQuery.trim() !== '') {
                filteredList = filteredList.filter(video => video.title.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            // ตัดเฉพาะจำนวนที่อนุญาตให้แสดง
            let visibleList = filteredList.slice(0, displayCount);

            if (filteredList.length === 0) {
                grid.innerHTML = `<p style="color: #777; grid-column: 1/-1; text-align: center; padding: 40px; font-size: 18px;">ไม่พบวิดีโอในหมวดหมู่ หรือคำค้นหานี้</p>`;
                loadMoreBox.style.display = 'none';
                return;
            }

            // สร้างการ์ดแสดงผล (แบบใหม่สวยขึ้น)
            visibleList.forEach(video => {
                grid.innerHTML += `
                    <a href="${video.link}" style="text-decoration: none;">
                        <div class="video-card">
                            <div class="thumbnail-container">
                                <img src="${video.image}" class="thumbnail" alt="ปกคลิป">

                                <img src="images/logo1.png" class="watermark-logo" alt="logo">
                                
                                <div class="play-overlay"><div class="play-icon"></div></div>
                            </div>
                            <div class="video-title">${video.title}</div>
                        </div>
                    </a>
                `;
            });

            // เช็คว่าถ้าแสดงครบหมดแล้ว ให้ซ่อนปุ่ม Load More
            if (displayCount >= filteredList.length) {
                loadMoreBox.style.display = 'none';
            } else {
                loadMoreBox.style.display = 'block';
            }
        }

        // ฟังก์ชันเมื่อคลิกเลือกหมวดหมู่
        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            currentCategory = cat;
            displayCount = 12; // แก้เป็น 12 เพื่อให้สลับหมวดแล้วโชว์ 12 คลิป
            renderVideos();
        }

        function searchVideos(keyword) {
            searchQuery = keyword;
            displayCount = 12; // รีเซ็ตการแสดงผลกลับมาเริ่มที่ 12 คลิปเมื่อค้นหาใหม่
            renderVideos();
        }

        // ฟังก์ชันเมื่อกดปุ่ม Load More
        function loadMoreVideos() {
            displayCount += itemsPerClick;
            renderVideos();

        renderVideos();
